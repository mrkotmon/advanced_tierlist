<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="'Редактор: ' + ${tierlistName}">Редактор</title>
    <style>
        .tier-column { display: inline-block; vertical-align: top; margin: 10px;
                       padding: 10px; border: 1px solid #ccc; min-width: 150px; }
        .object-card { border: 1px solid #ddd; padding: 5px; margin: 5px; background: #f9f9f9; }
        .unassigned { margin: 20px 0; }
    </style>
</head>

<body>
<div id="pageData"
     th:attr="data-tierlist-id=${tierlistId},data-is-owner=${isOwner}"
     style="display:none"></div>
<h1 th:text="${tierlistName}">Редактор</h1>

<div>
    <label>Показывать атрибут:</label>
    <select id="displayAttrSelect" onchange="updateDisplayAttribute()">
        <option value="">-- Не показывать --</option>
        <option th:each="attr : ${availableAttributes}"
                th:value="${attr}" th:text="${attr}"
                th:selected="${attr == displayAttribute}"></option>
    </select>
</div>

<!-- Контейнер тиров -->
<div id="tiers-container">
    <div th:each="tierEntry : ${tiers}" class="tier-column">
        <h3 th:text="${tierEntry.key}"></h3>
        <div class="tier-objects">
            <div th:each="obj : ${tierEntry.value}" class="object-card">
                <img th:if="${obj.image}" th:src="@{/uploads/{img}(img=${obj.image})}" width="50">
                <span th:text="${obj.name}"></span>
                <!-- оверлей с атрибутом добавим позже -->
            </div>
        </div>
    </div>
</div>

<button onclick="addTier()">Добавить тир</button>

<div class="unassigned">
    <h2>Нераспределённые</h2>
    <div id="unassigned-objects">
        <div th:each="obj : ${unassigned}" class="object-card">
            <!-- аналогичное отображение -->
        </div>
    </div>
</div>

<style>
    /* ...твои существующие стили... */

    /* Курсоры */
    .remote-cursor {
        position: fixed;            /* ← fixed, а не absolute! см. ниже */
        pointer-events: none;
        z-index: 9999;
        transition: left .05s linear, top .05s linear;
    }
    .remote-cursor svg { filter: drop-shadow(0 2px 3px rgba(0,0,0,.3)); }
    .remote-label {
        position: absolute; top: 22px; left: 14px;
        background: #14161A; color: #fff;
        font-size: 12px; padding: 2px 7px;
        border-radius: 5px; white-space: nowrap;
    }
</style>
<div id="joinModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.4);
     z-index:10000; align-items:center; justify-content:center;">
    <div style="background:#fff; padding:24px; border-radius:10px; max-width:400px;">
        <h3 id="joinText">Запрос на присоединение</h3>
        <div style="display:flex; gap:10px; margin-top:20px; justify-content:flex-end;">
            <button id="joinReject" style="padding:8px 16px; cursor:pointer;">Отклонить</button>
            <button id="joinAccept" style="padding:8px 16px; background:#2f80ed;
                    color:#fff; border:0; border-radius:6px; cursor:pointer;">Принять</button>
        </div>
    </div>
</div>
<script src="/cursors.js"></script>
<script>
    const pageData = document.getElementById('pageData');
    const TIERLIST_ID = parseInt(pageData.dataset.tierlistId || '0', 10);
    const IS_OWNER    = pageData.dataset.isOwner === 'true';

    console.log('TIERLIST_ID =', TIERLIST_ID, 'IS_OWNER =', IS_OWNER);

    connectCursors(TIERLIST_ID);

    async function beat() {
        try {
            const r = await fetch('/api/heartbeat', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({tierlistId: TIERLIST_ID})
            });
            const j = await r.json();
            console.log('[beat] tid=', TIERLIST_ID, '→', j);
        } catch (e) {
            console.error('[beat] error', e);
        }
    }
    beat();
    setInterval(beat, 5000);

    window.addEventListener('beforeunload', () => {
        try {
            navigator.sendBeacon('/api/leave');
            if (IS_OWNER) navigator.sendBeacon(`/api/collab/close/${TIERLIST_ID}`);
        } catch (e) {}
    });

    let pendingReq = null;
    const joinModal = document.getElementById('joinModal');
    const joinText = document.getElementById('joinText');

    if (IS_OWNER) {
        let lastShown = null;
        setInterval(async () => {
            try {
                const r = await fetch('/api/collab/pending');
                if (!r.ok) return;
                const list = await r.json();
                if (!list.length) return;
                const req = list[0];
                if (lastShown === req.id) return;
                lastShown = req.id;
                pendingReq = req;
                joinText.textContent = req.fromUsername + ' просит присоединиться к «' + req.tierlistName + '». Пустить?';
                joinModal.style.display = 'flex';
            } catch (e) {}
        }, 3000);
    }

    document.getElementById('joinAccept').onclick = async () => {
        if (!pendingReq) return;
        joinModal.style.display = 'none';
        await fetch('/api/collab/accept?requestId=' + pendingReq.id, {method:'POST'});
        pendingReq = null;
    };
    document.getElementById('joinReject').onclick = async () => {
        if (!pendingReq) return;
        joinModal.style.display = 'none';
        await fetch('/api/collab/reject?requestId=' + pendingReq.id, {method:'POST'});
        pendingReq = null;
    };
</script>
</body>
</html>
